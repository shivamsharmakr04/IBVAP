services:
  db:
    image: postgres:16
    container_name: ibvap-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ibvap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: ibvap-backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ibvap
      AI_API_KEY: ${AI_API_KEY:-change-this-secret}
      MEDIA_ROOT: /app/media
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media

volumes:
  postgres_data:
